<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Seunghye Seo — 4-Year Full-Cycle Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="55%" stop-color="#0E1B2E"/>
      <stop offset="100%" stop-color="#0A1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <circle cx="1010" cy="40" r="240" fill="url(#glowCyan)"/>
  <circle cx="1130" cy="280" r="200" fill="url(#glowViolet)"/>

  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <rect x="68" y="86" width="6" height="132" rx="3" fill="url(#accent)"/>

  <text x="98" y="112" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="4.5" fill="#7DD3FC">PORTFOLIO · 2026</text>

  <text x="96" y="178" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="58" font-weight="600" fill="#F8FAFC" letter-spacing="-1">Seunghye Seo</text>

  <text x="98" y="214" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="23" fill="#C7D2E1">4-Year Full-Cycle Software Engineer</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <rect x="98" y="238" width="150" height="30" rx="15" fill="#0F2A3D" stroke="#1E5F7A" stroke-width="1"/>
    <text x="173" y="257" text-anchor="middle" fill="#7DD3FC">Commerce SaaS</text>

    <rect x="258" y="238" width="196" height="30" rx="15" fill="#141F3D" stroke="#3B4A8A" stroke-width="1"/>
    <text x="356" y="257" text-anchor="middle" fill="#A5B4FC">Concurrent Ledger</text>

    <rect x="464" y="238" width="182" height="30" rx="15" fill="#0F2A3D" stroke="#1E5F7A" stroke-width="1"/>
    <text x="555" y="257" text-anchor="middle" fill="#7DD3FC">Shortform Pipeline</text>

    <rect x="656" y="238" width="196" height="30" rx="15" fill="#141F3D" stroke="#3B4A8A" stroke-width="1"/>
    <text x="754" y="257" text-anchor="middle" fill="#A5B4FC">Public Data Pipeline</text>
  </g>

  <!-- full-cycle diagram: plan -> db -> api -> web -> ops -> plan -->
  <g transform="translate(975,148)">
    <circle r="92" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle y="-92" r="7" fill="#38BDF8"/>
    <circle x="87.5" y="-28.4" r="6" fill="#60A5FA"/>
    <circle x="54.1" y="74.4" r="6" fill="#818CF8"/>
    <circle x="-54.1" y="74.4" r="6" fill="#818CF8"/>
    <circle x="-87.5" y="-28.4" r="6" fill="#60A5FA"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#94A3B8" letter-spacing="1.5">
      <text x="0" y="-106" text-anchor="middle">PLAN</text>
      <text x="103" y="-31" text-anchor="start">DB</text>
      <text x="65" y="97" text-anchor="start">API</text>
      <text x="-65" y="97" text-anchor="end">WEB</text>
      <text x="-103" y="-31" text-anchor="end">OPS</text>
    </g>
    <text x="0" y="-3" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#E2E8F0" letter-spacing="1.5">FULL</text>
    <text x="0" y="19" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#E2E8F0" letter-spacing="1.5">CYCLE</text>
  </g>
</svg>
