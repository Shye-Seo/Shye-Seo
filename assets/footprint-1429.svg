<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Engineering footprint: 1,429 tests, 612ms 100k-row parse, 0 oversell with 16 concurrent workers, 5s coupon dispatch, 41 abuse blocked, 12 PostgreSQL tables and 20 REST paths">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101E33"/>
    </linearGradient>
    <linearGradient id="cline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="249" rx="10" fill="url(#cbg)" stroke="#1E3A5F"/>
  <rect x="0.5" y="0.5" width="879" height="4" rx="2" fill="url(#cline)"/>

  <text x="30" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.5" fill="#7DD3FC">ENGINEERING FOOTPRINT</text>
  <text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">3 repositories · every number below is reproducible from the repo (commands in README)</text>

  <g stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.7">
    <line x1="30" y1="84" x2="850" y2="84"/>
    <line x1="30" y1="166" x2="850" y2="166"/>
    <line x1="303" y1="96" x2="303" y2="238"/>
    <line x1="577" y1="96" x2="577" y2="238"/>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="30" y="126" font-size="30" font-weight="700" fill="#F8FAFC">1,429</text>
    <text x="30" y="148" font-size="12" fill="#94A3B8">1,141 unit · 260 PHPUnit · 28 E2E</text>

    <text x="323" y="126" font-size="30" font-weight="700" fill="#F8FAFC">612ms</text>
    <text x="323" y="148" font-size="12" fill="#94A3B8">parse 100k-row settlement CSV (12.98MB)</text>

    <text x="597" y="126" font-size="30" font-weight="700" fill="#38BDF8">0</text>
    <text x="597" y="148" font-size="12" fill="#94A3B8">oversell · 16 concurrent workers, stock 1,000</text>

    <text x="30" y="208" font-size="30" font-weight="700" fill="#F8FAFC">5s</text>
    <text x="30" y="230" font-size="12" fill="#94A3B8">coupon dispatch SLA after a reel comment</text>

    <text x="323" y="208" font-size="30" font-weight="700" fill="#F8FAFC">41</text>
    <text x="323" y="230" font-size="12" fill="#94A3B8">abuse blocked in a 1,000-comment burst</text>

    <text x="597" y="208" font-size="30" font-weight="700" fill="#F8FAFC">12</text>
    <text x="597" y="230" font-size="12" fill="#94A3B8">PostgreSQL tables · 20 REST paths</text>
  </g>
</svg>
